<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1016" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Astra Station" />
  <title>ASTRA STATION // BRIDGE CONSOLE v3</title>
  <link rel="icon" type="image/jpeg" href="./astra-station+icon.jpeg" />
  <link rel="apple-touch-icon" href="./astra-station+icon.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --hull-dark: #0a0e14;
      --hull-mid: #141c26;
      --hull-plate: #1c2735;
      --hull-highlight: #2c3d52;
      --hull-trim: #070a0e;
      --hazard-yellow: #d99b26;
      --hazard-black: #111418;

      --crt-bg: #060b09;
      --crt-amber: #ffb000;
      --crt-amber-dim: #7a5200;
      --crt-amber-glow: rgba(255, 176, 0, 0.28);
      --crt-cyan: #38f2ff;
      --crt-cyan-dim: #126169;
      --crt-cyan-glow: rgba(56, 242, 255, 0.25);
      --crt-green: #3dff8b;
      --crt-red: #ff3b4e;

      --font-pixel: 'Press Start 2P', monospace;
      --font-term: 'VT323', monospace;
      --font-tech: 'Share Tech Mono', monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      height: 100dvh;
      background: #05070a;
      color: var(--crt-cyan);
      font-family: var(--font-tech);
      overflow: hidden;
    }

    /* =========================================================
       UNIFIED COCKPIT SHELL (STRICT VIEWPORT LOCK)
    ========================================================= */
    #bridge-shell {
      display: grid;
      grid-template-rows:
        40px
        minmax(108px, 19vh)
        auto
        minmax(0, 1fr)
        54px;
      width: 100%;
      max-width: 1100px;
      height: 100dvh;
      margin: 0 auto;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      background: linear-gradient(180deg, #0d131b 0%, #151e29 48%, #0d1219 100%);
      border-left: 2px solid var(--hull-trim);
      border-right: 2px solid var(--hull-trim);
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
    }

    #bridge-shell.dimmed::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(2, 5, 12, 0.44);
      pointer-events: none;
      z-index: 999;
    }

    /* =========================================================
       1. OVERHEAD BULKHEAD HEADER
    ========================================================= */
    .overhead-bulkhead {
      background: linear-gradient(180deg, #090d12 0%, #17212e 85%, #0a0e14 100%);
      border-bottom: 2px solid #06090d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      gap: 6px;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    .overhead-lamps {
      display: flex;
      gap: 5px;
      align-items: center;
      min-width: 0;
    }

    .recessed-lamp {
      width: 12px;
      height: 5px;
      flex-shrink: 0;
      background: var(--crt-amber);
      border-radius: 1px;
      box-shadow: 0 0 8px var(--crt-amber);
    }

    .recessed-lamp.alert {
      background: var(--crt-red);
      box-shadow: 0 0 10px var(--crt-red);
      animation: strobe 0.9s infinite alternate;
    }

    @keyframes strobe {
      from { opacity: 0.35; }
      to { opacity: 1; }
    }

    .station-id-plate {
      background: #0d131a;
      border: 1px solid var(--hull-highlight);
      padding: 2px 6px 2px 3px;
      font-family: var(--font-pixel);
      font-size: 7px;
      color: var(--crt-amber);
      text-shadow: 0 0 6px var(--crt-amber-glow);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .station-emblem {
      width: 18px;
      height: 18px;
      border: 1px solid var(--crt-amber-dim);
      border-radius: 2px;
      object-fit: cover;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .top-telemetry-strip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      flex-shrink: 0;
    }

    .hud-pill {
      background: #070b10;
      border: 1px solid #2b3c4e;
      padding: 2px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--crt-cyan);
      white-space: nowrap;
    }

    .hud-pill strong {
      color: var(--crt-amber);
      font-weight: normal;
    }

    .xp-mini-track {
      width: 34px;
      height: 6px;
      background: #0d171c;
      border: 1px solid var(--crt-cyan-dim);
      overflow: hidden;
    }

    .xp-mini-fill {
      height: 100%;
      background: var(--crt-cyan);
      box-shadow: 0 0 6px var(--crt-cyan);
      transition: width 0.35s ease;
    }

    /* =========================================================
       2. PANORAMIC OBSERVATION VIEWPORT (ALWAYS VISIBLE)
    ========================================================= */
    .observatory-bay {
      position: relative;
      background: #03060c;
      border-bottom: 3px solid #0b1017;
      overflow: hidden;
      width: 100%;
      min-width: 0;
    }

    #space-canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .viewport-frame-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 32px rgba(0, 0, 0, 0.85);
      border-top: 2px solid #182330;
    }

    .viewport-pillar {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 12px;
      background: linear-gradient(90deg, #0b1017 0%, #223042 45%, #111822 100%);
      border-left: 1px solid #06090d;
      border-right: 1px solid #06090d;
      z-index: 3;
    }

    .viewport-pillar.left { left: 14%; transform: skewX(-4deg); }
    .viewport-pillar.right { right: 14%; transform: skewX(4deg); }

    .safety-rail {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      height: 8px;
      border-top: 2px solid #2b3c50;
      border-bottom: 1px solid #16202b;
      background: rgba(10, 15, 22, 0.25);
      z-index: 4;
    }

    .viewport-controls {
      position: absolute;
      top: 6px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 5;
      pointer-events: none;
    }

    .viewport-tag {
      background: rgba(7, 12, 18, 0.84);
      border: 1px solid #2d4259;
      padding: 2px 6px;
      font-size: 10px;
      color: #8bb8d9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .viewport-lever-box {
      pointer-events: auto;
      background: #141d28;
      border: 1px solid #2f4257;
      padding: 2px 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .lever-btn {
      background: #0a1017;
      border: 1px solid var(--crt-cyan-dim);
      color: var(--crt-cyan);
      font-family: var(--font-tech);
      font-size: 10px;
      padding: 2px 5px;
      cursor: pointer;
    }

    .lever-btn.active {
      background: var(--crt-cyan);
      color: #041014;
      font-weight: bold;
    }

    /* =========================================================
       3. ALWAYS-VISIBLE AMBER VITALS TELEMETRY STRIP
    ========================================================= */
    .vitals-strip-bay {
      background: linear-gradient(180deg, #1b2533 0%, #111822 100%);
      border-bottom: 2px solid #2c3d52;
      padding: 5px 8px;
      width: 100%;
      min-width: 0;
    }

    .vitals-crt-box {
      background: radial-gradient(circle at center, #181104 0%, #080501 100%);
      border: 2px solid #090d12;
      border-radius: 6px;
      padding: 5px 7px;
      color: var(--crt-amber);
      text-shadow: 0 0 4px var(--crt-amber-glow);
      box-shadow: inset 0 0 14px #000;
      position: relative;
      overflow: hidden;
    }

    .scanlines-enabled .vitals-crt-box::after,
    .scanlines-enabled .crt-bezel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.32) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 4;
    }

    .vitals-grid-2x3 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 10px;
      width: 100%;
    }

    .v-mini-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .v-mini-top {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      line-height: 1;
    }

    .v-mini-segs {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 1.5px;
      height: 6px;
      background: rgba(255, 176, 0, 0.08);
      padding: 1px;
      border: 1px solid var(--crt-amber-dim);
    }

    .v-seg {
      background: rgba(255, 176, 0, 0.12);
    }

    .v-seg.on {
      background: var(--crt-amber);
      box-shadow: 0 0 3px var(--crt-amber);
    }

    .v-seg.crit {
      background: var(--crt-red);
      box-shadow: 0 0 4px var(--crt-red);
    }

    /* =========================================================
       4. CENTER PRIMARY CRT DECK MONITOR
    ========================================================= */
    .main-console-bay {
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .crt-bezel {
      flex: 1;
      width: 100%;
      background: #070a0e;
      border: 3px solid #0b1016;
      border-radius: 8px;
      padding: 2px;
      box-shadow: inset 0 0 14px #000, 0 1px 0 rgba(255, 255, 255, 0.07);
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .crt-screen {
      flex: 1;
      width: 100%;
      background: radial-gradient(circle at center, #06181c 0%, #03090b 100%);
      border-radius: 6px;
      padding: 8px;
      color: var(--crt-cyan);
      text-shadow: 0 0 5px var(--crt-cyan-glow);
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.95);
      min-width: 0;
      min-height: 0;
    }

    .crt-screen.amber-mode {
      background: radial-gradient(circle at center, #181104 0%, #080501 100%);
      color: var(--crt-amber);
      text-shadow: 0 0 5px var(--crt-amber-glow);
    }

    .crt-screen::-webkit-scrollbar { width: 4px; }
    .crt-screen::-webkit-scrollbar-track { background: #040708; }
    .crt-screen::-webkit-scrollbar-thumb { background: #26484d; border-radius: 2px; }

    /* Terminal Header Strip */
    .term-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--crt-cyan-dim);
      padding-bottom: 5px;
      margin-bottom: 8px;
      gap: 6px;
      width: 100%;
      min-width: 0;
    }

    .term-title {
      font-family: var(--font-pixel);
      font-size: 8px;
      line-height: 1.4;
      color: var(--crt-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .term-action-btn {
      background: rgba(56, 242, 255, 0.12);
      border: 1px solid var(--crt-cyan);
      color: var(--crt-cyan);
      font-family: var(--font-tech);
      font-size: 12px;
      padding: 3px 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .term-action-btn:hover, .term-action-btn:active {
      background: var(--crt-cyan);
      color: #031014;
    }

    /* Habit Protocol Modules */
    .protocol-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 7px;
      width: 100%;
    }

    .protocol-module {
      border: 1px solid var(--crt-cyan-dim);
      background: rgba(56, 242, 255, 0.04);
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      min-width: 0;
    }

    .protocol-module.logged-today {
      border-color: var(--crt-green);
      background: rgba(61, 255, 139, 0.06);
    }

    .proto-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
    }

    .proto-name {
      font-size: 15px;
      font-weight: bold;
      color: #e2fbff;
      word-break: break-word;
      min-width: 0;
    }

    .proto-vital-badge {
      font-size: 10px;
      padding: 1px 4px;
      border: 1px solid currentColor;
      text-transform: uppercase;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .proto-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #7eb8c2;
    }

    .proto-controls {
      display: flex;
      gap: 5px;
      width: 100%;
    }

    .engage-switch {
      flex: 1;
      min-width: 0;
      background: #082329;
      border: 1px solid var(--crt-cyan);
      color: var(--crt-cyan);
      font-family: var(--font-tech);
      font-size: 13px;
      padding: 5px 6px;
      cursor: pointer;
      text-align: center;
    }

    .engage-switch:hover, .engage-switch:active {
      background: var(--crt-cyan);
      color: #031014;
      font-weight: bold;
    }

    .del-proto-btn {
      background: transparent;
      border: 1px solid #4a252b;
      color: #b85c68;
      font-family: var(--font-tech);
      padding: 0 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Telemetry Chart & Logs */
    .telemetry-bars {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      align-items: end;
      height: 95px;
      padding: 6px;
      border: 1px solid var(--crt-cyan-dim);
      background: rgba(0, 0, 0, 0.35);
      margin-bottom: 8px;
      width: 100%;
    }

    .t-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 2px;
      min-width: 0;
    }

    .t-bar {
      width: 100%;
      max-width: 22px;
      background: var(--crt-cyan);
      box-shadow: 0 0 6px var(--crt-cyan-glow);
      min-height: 3px;
    }

    .t-lbl {
      font-size: 10px;
      color: #7eb8c2;
    }

    .log-stream {
      font-family: var(--font-term);
      font-size: 15px;
      line-height: 1.3;
      color: #9be8f0;
    }

    .log-entry {
      padding: 3px 0;
      border-bottom: 1px dotted rgba(56, 242, 255, 0.15);
      word-break: break-word;
    }

    /* Supplies & Lounge */
    .qm-item {
      border: 1px solid var(--crt-cyan-dim);
      padding: 7px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: rgba(56, 242, 255, 0.03);
      width: 100%;
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 8px;
      width: 100%;
    }

    .class-card {
      border: 1px solid var(--crt-cyan-dim);
      padding: 7px;
      cursor: pointer;
      background: rgba(56, 242, 255, 0.03);
      min-width: 0;
    }

    .class-card.selected {
      border-color: var(--crt-amber);
      background: rgba(255, 176, 0, 0.09);
      color: var(--crt-amber);
    }

    /* Hardware Switches & Gist Uplink (Tab 05) */
    .switch-bank {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 10px;
      width: 100%;
    }

    .rocker-switch {
      background: #0c1219;
      border: 1px solid var(--crt-amber-dim);
      padding: 6px 4px;
      text-align: center;
      cursor: pointer;
    }

    .rocker-toggle {
      width: 26px;
      height: 12px;
      margin: 0 auto 4px;
      background: #1d2733;
      border: 1px solid #49607a;
      position: relative;
    }

    .rocker-toggle::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 1px;
      width: 8px;
      height: 8px;
      background: #6c8299;
      transition: left 0.12s ease;
    }

    .rocker-switch.on .rocker-toggle::after {
      left: 15px;
      background: var(--crt-amber);
      box-shadow: 0 0 6px var(--crt-amber);
    }

    .rocker-label {
      font-size: 10px;
      color: var(--crt-amber);
      display: block;
    }

    .gist-form-group {
      margin-bottom: 8px;
      font-size: 12px;
      width: 100%;
    }

    .gist-input {
      width: 100%;
      background: #04070a;
      border: 1px solid var(--crt-amber-dim);
      color: var(--crt-amber);
      font-family: var(--font-tech);
      font-size: 13px;
      padding: 6px;
      margin-top: 3px;
    }

    .gist-btn-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
      width: 100%;
    }

    .amber-btn {
      background: rgba(255, 176, 0, 0.12);
      border: 1px solid var(--crt-amber);
      color: var(--crt-amber);
      font-family: var(--font-tech);
      font-size: 13px;
      padding: 6px;
      cursor: pointer;
    }

    .amber-btn:hover, .amber-btn:active {
      background: var(--crt-amber);
      color: #090600;
      font-weight: bold;
    }

    /* =========================================================
       5. BOTTOM CONSOLE TACTILE SWITCHBANK (5 TABS)
    ========================================================= */
    .bottom-console-bar {
      background: linear-gradient(180deg, #17212e 0%, #0b1017 100%);
      border-top: 2px solid #324459;
      padding: 5px 6px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
      width: 100%;
      min-width: 0;
    }

    .mech-btn {
      background: linear-gradient(180deg, #273547 0%, #161f2b 100%);
      border: 1.5px solid #0b1016;
      border-top-color: #435975;
      border-radius: 4px;
      color: #9cb3c9;
      font-family: var(--font-tech);
      font-size: 11px;
      padding: 3px 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 0 #070a0f;
    }

    .mech-btn:active {
      transform: translateY(1px);
    }

    .mech-btn .cap-led {
      width: 16px;
      height: 3px;
      background: #2f3e4f;
      border-radius: 1px;
    }

    .mech-btn.active {
      background: linear-gradient(180deg, #1b3640 0%, #0f2129 100%);
      color: var(--crt-cyan);
      border-top-color: var(--crt-cyan);
      text-shadow: 0 0 6px var(--crt-cyan-glow);
    }

    .mech-btn.active .cap-led {
      background: var(--crt-cyan);
      box-shadow: 0 0 8px var(--crt-cyan);
    }

    /* =========================================================
       IN-TERMINAL MODAL (ADD PROTOCOL)
    ========================================================= */
    #protocol-modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 10, 0.84);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 14px;
    }

    #protocol-modal.open {
      display: flex;
    }

    .modal-chassis {
      width: 100%;
      max-width: 380px;
      background: #131c26;
      border: 3px solid #354b63;
      padding: 10px;
    }

    .modal-screen {
      background: #04090b;
      border: 2px solid var(--crt-cyan-dim);
      padding: 12px;
      color: var(--crt-cyan);
    }

    .modal-field {
      margin-bottom: 10px;
    }

    .modal-field label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #8ad6e0;
    }

    .modal-field input, .modal-field select {
      width: 100%;
      background: #071317;
      border: 1px solid var(--crt-cyan);
      color: var(--crt-cyan);
      font-family: var(--font-tech);
      font-size: 14px;
      padding: 6px;
    }

    @media (max-width: 520px) {
      .protocol-grid {
        grid-template-columns: minmax(0, 1fr);
      }
      .hide-xs {
        display: none !important;
      }
    }
  </style>
</head>
<body class="scanlines-enabled">

  <div id="bridge-shell">
    <!-- =======================================================
         1. OVERHEAD BULKHEAD HEADER
    ======================================================= -->
    <header class="overhead-bulkhead">
      <div class="overhead-lamps">
        <div class="recessed-lamp" id="lamp-1"></div>
        <div class="recessed-lamp" id="lamp-2"></div>
        <div class="station-id-plate">
          <img src="./astra-station+icon.jpeg" alt="Astra Station Emblem" class="station-emblem" />
          <span>ASTRA v3</span>
        </div>
      </div>

      <div class="top-telemetry-strip">
        <div class="hud-pill" title="Commander Rank & XP">
          <span>LVL <strong id="hud-lvl">1</strong></span>
          <div class="xp-mini-track"><div class="xp-mini-fill" id="hud-xp-bar" style="width:0%"></div></div>
        </div>
        <div class="hud-pill" title="Station Credits">
          <span>⎈ <strong id="hud-credits">0</strong></span>
        </div>
        <div class="hud-pill hide-xs" title="Station Clock">
          <span id="hud-clock">00:00:00</span>
        </div>
      </div>
    </header>

    <!-- =======================================================
         2. PANORAMIC OBSERVATION VIEWPORT (ALWAYS ON)
    ======================================================= -->
    <section class="observatory-bay">
      <canvas id="space-canvas"></canvas>
      <div class="viewport-pillar left"></div>
      <div class="viewport-pillar right"></div>
      <div class="safety-rail"></div>
      <div class="viewport-frame-overlay"></div>

      <div class="viewport-controls">
        <div class="viewport-tag" id="orbit-telemetry-tag">
          ALT: 408.2 KM // INC: 51.6°
        </div>
        <div class="viewport-lever-box">
          <button class="lever-btn active" id="btn-view-orbit" onclick="setViewportMode('orbit')">ORBIT</button>
          <button class="lever-btn" id="btn-view-radar" onclick="setViewportMode('radar')">RADAR</button>
        </div>
      </div>
    </section>

    <!-- =======================================================
         3. ALWAYS-VISIBLE AMBER VITALS TELEMETRY STRIP
    ======================================================= -->
    <section class="vitals-strip-bay">
      <div class="vitals-crt-box">
        <div class="vitals-grid-2x3" id="vitals-strip-grid"></div>
      </div>
    </section>

    <!-- =======================================================
         4. CENTER PRIMARY CRT DECK SCREEN
    ======================================================= -->
    <main class="main-console-bay">
      <div class="crt-bezel">
        <div class="crt-screen" id="main-crt"></div>
      </div>
    </main>

    <!-- =======================================================
         5. BOTTOM CONSOLE TACTILE SWITCHBANK (5 TABS)
    ======================================================= -->
    <nav class="bottom-console-bar">
      <button class="mech-btn active" id="tab-protocols" onclick="switchDeck('protocols')">
        <span class="cap-led"></span>
        <span>01 PROTO</span>
      </button>
      <button class="mech-btn" id="tab-telemetry" onclick="switchDeck('telemetry')">
        <span class="cap-led"></span>
        <span>02 TELEM</span>
      </button>
      <button class="mech-btn" id="tab-quartermaster" onclick="switchDeck('quartermaster')">
        <span class="cap-led"></span>
        <span>03 SUPPLY</span>
      </button>
      <button class="mech-btn" id="tab-lounge" onclick="switchDeck('lounge')">
        <span class="cap-led"></span>
        <span>04 LOUNGE</span>
      </button>
      <button class="mech-btn" id="tab-uplink" onclick="switchDeck('uplink')">
        <span class="cap-led"></span>
        <span>05 UPLINK</span>
      </button>
    </nav>
  </div>

  <!-- ADD NEW PROTOCOL MODAL -->
  <div id="protocol-modal">
    <div class="modal-chassis">
      <div class="modal-screen">
        <div style="font-family:var(--font-pixel); font-size:9px; margin-bottom:10px; color:var(--crt-amber);">
          + REGISTER STATION PROTOCOL
        </div>
        <div class="modal-field">
          <label>PROTOCOL DESIGNATION (HABIT NAME)</label>
          <input type="text" id="new-habit-name" placeholder="e.g., Hydrate 2L / Screen Print Prep" />
        </div>
        <div class="modal-field">
          <label>LINKED STATION VITAL (+15% ON ENGAGE)</label>
          <select id="new-habit-vital">
            <option value="oxygen">OXYGEN (Hydration / Breath / Outdoors)</option>
            <option value="bio">BIO (Nutrition / Fitness / Rest)</option>
            <option value="power">POWER (Deep Work / Focus / Chores)</option>
            <option value="morale">MORALE (Creative / Music / Reading)</option>
            <option value="shields">SHIELDS (Admin / Maintenance / Defense)</option>
            <option value="earth">EARTH LINK (Social / Family / Comms)</option>
          </select>
        </div>
        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
          <button class="term-action-btn" style="border-color:#6d859c; color:#8ca3ba;" onclick="closeProtocolModal()">ABORT</button>
          <button class="term-action-btn" onclick="createProtocol()">INITIALIZE</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       1. PERSISTENCE & GAME STATE ENGINE (v3 / v4 COMPATIBLE)
    ========================================================= */
    const STORAGE_KEY = 'astra_station_save_v4';
    const LEGACY_KEY = 'astra_station_save_v3';
    const DEFAULT_GIST_ID = '801f264895fb9e4c5d5130684e259088';
    const GIST_FILENAME = 'astra_station_save.json';

    const DEFAULT_STATE = {
      level: 1,
      xp: 0,
      credits: 120,
      playerClass: 'Flight Engineer',
      lastDecayTimestamp: Date.now(),
      vitals: {
        oxygen: 88,
        morale: 82,
        shields: 90,
        bio: 85,
        power: 92,
        earth: 78
      },
      habits: [
        { id: 'h1', name: 'Hydro-Ration Cycle (2L Water)', vital: 'oxygen', color: '#38f2ff', count: 4, lastLogged: null, history: {} },
        { id: 'h2', name: 'Protein & Galley Prep', vital: 'bio', color: '#3dff8b', count: 3, lastLogged: null, history: {} },
        { id: 'h3', name: 'Deep Systems Focus Block', vital: 'power', color: '#ffb000', count: 5, lastLogged: null, history: {} },
        { id: 'h4', name: 'Analog Craft / Analog Audio', vital: 'morale', color: '#ff6ec7', count: 2, lastLogged: null, history: {} },
        { id: 'h5', name: 'Hull & Quarters Maintenance', vital: 'shields', color: '#7aa2ff', count: 2, lastLogged: null, history: {} },
        { id: 'h6', name: 'Earth Subspace Comms Check-In', vital: 'earth', color: '#5ce1e6', count: 1, lastLogged: null, history: {} }
      ],
      ownedItems: ['std-console'],
      achievements: ['first-orbit'],
      logs: [
        `[${new Date().toLocaleTimeString()}] ASTRA BRIDGE v3 ONLINE.`
      ]
    };

    let gameState = loadGameState();
    let activeDeck = 'protocols';
    let viewportMode = 'orbit';
    let hwPrefs = {
      scanlines: true,
      audio: true,
      dimmer: false
    };

    function loadGameState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(DEFAULT_STATE),
          ...parsed,
          vitals: { ...DEFAULT_STATE.vitals, ...(parsed.vitals || {}) },
          habits: Array.isArray(parsed.habits) && parsed.habits.length ? parsed.habits : structuredClone(DEFAULT_STATE.habits),
          logs: Array.isArray(parsed.logs) ? parsed.logs.slice(0, 40) : structuredClone(DEFAULT_STATE.logs)
        };
      } catch (e) {
        console.error('Save load failed, initializing fresh bridge state:', e);
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveGameState() {
      const serialized = JSON.stringify(gameState);
      localStorage.setItem(STORAGE_KEY, serialized);
      localStorage.setItem(LEGACY_KEY, serialized);
      updateTopHUD();
    }

    function todayKey() {
      return new Date().toISOString().slice(0, 10);
    }

    function appendLog(msg) {
      const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      gameState.logs.unshift(`[${stamp}] ${msg}`);
      if (gameState.logs.length > 35) gameState.logs.pop();
    }

    /* =========================================================
       2. HOURLY VITALS DECAY ENGINE (3%/HR, HALVED 00:00-05:00)
    ========================================================= */
    function applyVitalsDecay() {
      const now = Date.now();
      const last = gameState.lastDecayTimestamp || now;
      const elapsedHours = (now - last) / (1000 * 60 * 60);

      if (elapsedHours >= 0.05) {
        const hour = new Date().getHours();
        const isNightCycle = hour >= 0 && hour < 5;
        const ratePerHour = isNightCycle ? 1.5 : 3.0;
        const drop = elapsedHours * ratePerHour;

        Object.keys(gameState.vitals).forEach(k => {
          gameState.vitals[k] = Math.max(0, +(gameState.vitals[k] - drop).toFixed(1));
        });
        gameState.lastDecayTimestamp = now;
        saveGameState();
      }
    }

    /* =========================================================
       3. TACTILE SYNTH AUDIO ENGINE
    ========================================================= */
    let audioCtx = null;
    function playClick(freq = 520, duration = 0.04, type = 'square') {
      if (!hwPrefs.audio) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (_) {}
    }

    /* =========================================================
       4. HABIT PROTOCOL ENGAGEMENT & PROGRESSION
    ========================================================= */
    function engageProtocol(habitId) {
      const habit = gameState.habits.find(h => h.id === habitId);
      if (!habit) return;

      playClick(680, 0.06, 'triangle');
      const day = todayKey();
      habit.count = (habit.count || 0) + 1;
      habit.lastLogged = Date.now();
      habit.history = habit.history || {};
      habit.history[day] = (habit.history[day] || 0) + 1;

      let vKey = habit.vital;
      if (!vKey || gameState.vitals[vKey] === undefined) {
        vKey = Object.keys(gameState.vitals).reduce((a, b) =>
          gameState.vitals[a] <= gameState.vitals[b] ? a : b
        );
      }
      gameState.vitals[vKey] = Math.min(100, +(gameState.vitals[vKey] + 15).toFixed(1));

      const creditBonus = gameState.playerClass === 'Quartermaster' ? 18 : 12;
      const xpGain = gameState.playerClass === 'Flight Engineer' ? 30 : 25;

      gameState.credits += creditBonus;
      gameState.xp += xpGain;

      const xpNeeded = gameState.level * 100;
      if (gameState.xp >= xpNeeded) {
        gameState.xp -= xpNeeded;
        gameState.level += 1;
        playClick(880, 0.14, 'square');
        appendLog(`PROMOTION! COMMANDER LEVEL ${gameState.level}`);
      } else {
        appendLog(`EXECUTED: ${habit.name} (+${xpGain} XP, +${creditBonus}⎈, ${vKey.toUpperCase()} +15%)`);
      }

      saveGameState();
      renderVitalsStrip();
      renderMainCRT();
    }

    function openProtocolModal() {
      playClick(580, 0.04);
      document.getElementById('protocol-modal').classList.add('open');
      document.getElementById('new-habit-name').focus();
    }

    function closeProtocolModal() {
      playClick(360, 0.04);
      document.getElementById('protocol-modal').classList.remove('open');
    }

    function createProtocol() {
      const nameInput = document.getElementById('new-habit-name');
      const vitalSelect = document.getElementById('new-habit-vital');
      const name = nameInput.value.trim();
      if (!name) return;

      const palette = ['#38f2ff', '#ffb000', '#3dff8b', '#ff6ec7', '#7aa2ff'];
      gameState.habits.push({
        id: 'h_' + Date.now(),
        name,
        vital: vitalSelect.value,
        color: palette[gameState.habits.length % palette.length],
        count: 0,
        lastLogged: null,
        history: {}
      });

      nameInput.value = '';
      closeProtocolModal();
      appendLog(`REGISTERED: ${name}`);
      saveGameState();
      renderMainCRT();
    }

    function deleteProtocol(id) {
      playClick(280, 0.05);
      gameState.habits = gameState.habits.filter(h => h.id !== id);
      appendLog('PROTOCOL REMOVED FROM CONSOLE.');
      saveGameState();
      renderMainCRT();
    }

    /* =========================================================
       5. ALWAYS-VISIBLE AMBER VITALS STRIP RENDERER
    ========================================================= */
    function renderVitalsStrip() {
      const grid = document.getElementById('vitals-strip-grid');
      const entries = [
        { key: 'oxygen', label: 'OXYGEN' },
        { key: 'morale', label: 'MORALE' },
        { key: 'shields', label: 'SHIELDS' },
        { key: 'bio', label: 'BIO-SYS' },
        { key: 'power', label: 'REACTOR' },
        { key: 'earth', label: 'EARTH' }
      ];

      let anyCritical = false;
      grid.innerHTML = entries.map(item => {
        const val = Math.round(gameState.vitals[item.key] ?? 100);
        if (val < 25) anyCritical = true;
        const litCount = Math.round((val / 100) * 12);
        let segs = '';
        for (let i = 0; i < 12; i++) {
          const cls = i < litCount ? (val < 25 ? 'v-seg crit' : 'v-seg on') : 'v-seg';
          segs += `<div class="${cls}"></div>`;
        }
        return `
          <div class="v-mini-item">
            <div class="v-mini-top">
              <span>${item.label}</span>
              <span>${val}%</span>
            </div>
            <div class="v-mini-segs">${segs}</div>
          </div>
        `;
      }).join('');

      document.getElementById('lamp-1').classList.toggle('alert', anyCritical);
      document.getElementById('lamp-2').classList.toggle('alert', anyCritical);
    }

    /* =========================================================
       6. CENTER PRIMARY CRT DECK RENDERER
    ========================================================= */
    function switchDeck(deck) {
      playClick(490, 0.04);
      activeDeck = deck;
      document.querySelectorAll('.bottom-console-bar .mech-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('tab-' + deck);
      if (btn) btn.classList.add('active');
      renderMainCRT();
    }

    function renderMainCRT() {
      const crt = document.getElementById('main-crt');
      const today = todayKey();
      crt.classList.toggle('amber-mode', activeDeck === 'uplink');

      if (activeDeck === 'protocols') {
        const cards = gameState.habits.map(h => {
          const todayCount = (h.history && h.history[today]) || 0;
          const badgeText = h.vital ? h.vital.toUpperCase() : 'SYS';
          const badgeColor = h.color || '#38f2ff';
          return `
            <div class="protocol-module ${todayCount > 0 ? 'logged-today' : ''}">
              <div class="proto-top">
                <div class="proto-name">${h.name}</div>
                <span class="proto-vital-badge" style="color:${badgeColor}">${badgeText}</span>
              </div>
              <div class="proto-meta">
                <span>TODAY: <strong>${todayCount}x</strong></span>
                <span>TOTAL: <strong>${h.count || 0}</strong></span>
              </div>
              <div class="proto-controls">
                <button class="engage-switch" onclick="engageProtocol('${h.id}')">[ ENGAGE PROTOCOL ]</button>
                <button class="del-proto-btn" title="Remove" onclick="deleteProtocol('${h.id}')">✕</button>
              </div>
            </div>
          `;
        }).join('');

        crt.innerHTML = `
          <div class="term-toolbar">
            <span class="term-title">DECK 01 // HABIT PROTOCOLS</span>
            <button class="term-action-btn" onclick="openProtocolModal()">+ ADD</button>
          </div>
          <div class="protocol-grid">${cards}</div>
        `;
      } else if (activeDeck === 'telemetry') {
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const key = d.toISOString().slice(0, 10);
          let total = 0;
          gameState.habits.forEach(h => {
            if (h.history && h.history[key]) total += h.history[key];
          });
          days.push({ label: key.slice(5), total });
        }
        const maxVal = Math.max(5, ...days.map(d => d.total));
        const bars = days.map(d => {
          const pct = Math.round((d.total / maxVal) * 68);
          return `
            <div class="t-col">
              <span style="font-size:10px;">${d.total}</span>
              <div class="t-bar" style="height:${pct}px"></div>
              <span class="t-lbl">${d.label}</span>
            </div>
          `;
        }).join('');

        const hour = new Date().getHours();
        const night = hour >= 0 && hour < 5;
        const logsHtml = gameState.logs.map(l => `<div class="log-entry">&gt; ${l}</div>`).join('');

        crt.innerHTML = `
          <div class="term-toolbar">
            <span class="term-title">DECK 02 // TELEMETRY</span>
            <span style="font-size:11px;">DECAY: ${night ? '1.5%/HR' : '3.0%/HR'}</span>
          </div>
          <div class="telemetry-bars">${bars}</div>
          <div class="log-stream">${logsHtml}</div>
        `;
      } else if (activeDeck === 'quartermaster') {
        const catalog = [
          { id: 'o2-scrubber', name: 'Mk-II Algae O2 Scrubber', desc: 'Restores +35% OXYGEN immediately.', cost: 60, action: () => { gameState.vitals.oxygen = Math.min(100, gameState.vitals.oxygen + 35); } },
          { id: 'coffee-synth', name: 'Espresso Synthesizer', desc: 'Restores +35% MORALE & +20% REACTOR.', cost: 75, action: () => { gameState.vitals.morale = Math.min(100, gameState.vitals.morale + 35); gameState.vitals.power = Math.min(100, gameState.vitals.power + 20); } },
          { id: 'hull-plating', name: 'Ablative Hull Armor', desc: 'Restores +40% SHIELDS.', cost: 80, action: () => { gameState.vitals.shields = Math.min(100, gameState.vitals.shields + 40); } },
          { id: 'hydro-bay', name: 'Hydroponic Galley Bay', desc: 'Restores +35% BIO & +25% EARTH.', cost: 90, action: () => { gameState.vitals.bio = Math.min(100, gameState.vitals.bio + 35); gameState.vitals.earth = Math.min(100, gameState.vitals.earth + 25); } }
        ];

        const itemsHtml = catalog.map(item => `
          <div class="qm-item">
            <div style="min-width:0;">
              <div style="font-size:14px; color:#fff;">${item.name}</div>
              <div style="font-size:12px; color:#7eb8c2;">${item.desc}</div>
            </div>
            <button class="term-action-btn" onclick="requisitionItem('${item.id}', ${item.cost})">
              ${item.cost}⎈
            </button>
          </div>
        `).join('');

        crt.innerHTML = `
          <div class="term-toolbar">
            <span class="term-title">DECK 03 // SUPPLIES</span>
            <span style="color:var(--crt-amber);">${gameState.credits}⎈</span>
          </div>
          ${itemsHtml}
        `;
        window._qmCatalog = catalog;
      } else if (activeDeck === 'lounge') {
        const classes = [
          { name: 'Flight Engineer', perk: '+5 XP bonus per protocol.' },
          { name: 'Quartermaster', perk: '+6⎈ bonus per protocol.' },
          { name: 'Astro-Botanist', perk: 'Life Support & Bio focus.' },
          { name: 'Comms Officer', perk: 'Earth Subspace Uplink.' }
        ];

        const classHtml = classes.map(c => `
          <div class="class-card ${gameState.playerClass === c.name ? 'selected' : ''}" onclick="selectClass('${c.name}')">
            <div style="font-weight:bold; font-size:13px;">${c.name.toUpperCase()}</div>
            <div style="font-size:11px; opacity:0.85; margin-top:3px;">${c.perk}</div>
          </div>
        `).join('');

        crt.innerHTML = `
          <div class="term-toolbar">
            <span class="term-title">DECK 04 // LOUNGE</span>
            <span style="font-size:11px;">${gameState.playerClass.toUpperCase()}</span>
          </div>
          <div style="font-size:12px; margin-bottom:6px; color:#8ad6e0;">COMMANDER SPECIALIZATION:</div>
          <div class="class-grid">${classHtml}</div>
          <div style="border:1px solid var(--crt-cyan-dim); padding:7px; font-size:12px;">
            ASTRA STATION v3 // LEO Sector 07 // Self-Hosted Bridge Node // Local & GitHub Gist persistence active.
          </div>
        `;
      } else if (activeDeck === 'uplink') {
        const savedToken = localStorage.getItem('astra_gist_token') || '';
        const savedGistId = localStorage.getItem('astra_gist_id') || DEFAULT_GIST_ID;

        crt.innerHTML = `
          <div class="term-toolbar" style="border-color:var(--crt-amber-dim);">
            <span class="term-title" style="color:var(--crt-amber);">DECK 05 // SYS & GIST UPLINK</span>
          </div>
          <div class="switch-bank">
            <div class="rocker-switch ${hwPrefs.scanlines ? 'on' : ''}" id="sw-scanlines" onclick="toggleHardware('scanlines')">
              <div class="rocker-toggle"></div>
              <span class="rocker-label">SCANLINES</span>
            </div>
            <div class="rocker-switch ${hwPrefs.audio ? 'on' : ''}" id="sw-audio" onclick="toggleHardware('audio')">
              <div class="rocker-toggle"></div>
              <span class="rocker-label">KEY AUDIO</span>
            </div>
            <div class="rocker-switch ${hwPrefs.dimmer ? 'on' : ''}" id="sw-dimmer" onclick="toggleHardware('dimmer')">
              <div class="rocker-toggle"></div>
              <span class="rocker-label">NIGHT DIM</span>
            </div>
          </div>
          <div class="gist-form-group">
            <label>GIST ID (${GIST_FILENAME})</label>
            <input type="text" class="gist-input" id="gist-id-input" value="${savedGistId}" />
          </div>
          <div class="gist-form-group">
            <label>GITHUB PERSONAL ACCESS TOKEN</label>
            <input type="password" class="gist-input" id="gist-token-input" value="${savedToken}" placeholder="ghp_xxxxxxxxxxxx" />
          </div>
          <div class="gist-btn-row">
            <button class="amber-btn" onclick="pushToGist()">▲ PUSH GIST</button>
            <button class="amber-btn" onclick="pullFromGist()">▼ PULL GIST</button>
          </div>
          <div id="sync-status-msg" style="margin-top:8px; font-size:12px;">
            STATUS: LOCAL STORAGE ACTIVE
          </div>
          <div style="margin-top:8px;">
            <button class="amber-btn" style="width:100%;" onclick="exportSaveJSON()">EXPORT RAW JSON</button>
          </div>
        `;
      }
    }

    function requisitionItem(id, cost) {
      if (gameState.credits < cost) {
        playClick(200, 0.08);
        appendLog('INSUFFICIENT CREDITS (⎈).');
        return;
      }
      const item = (window._qmCatalog || []).find(i => i.id === id);
      if (!item) return;
      playClick(760, 0.08, 'triangle');
      gameState.credits -= cost;
      item.action();
      if (!gameState.ownedItems.includes(id)) gameState.ownedItems.push(id);
      appendLog(`REQUISITIONED: ${item.name} (-${cost}⎈)`);
      saveGameState();
      renderVitalsStrip();
      renderMainCRT();
    }

    function selectClass(cls) {
      playClick(600, 0.05);
      gameState.playerClass = cls;
      appendLog(`SPECIALIZATION: ${cls.toUpperCase()}`);
      saveGameState();
      renderMainCRT();
    }

    /* =========================================================
       7. HARDWARE SWITCHES & GITHUB GIST CLOUD SYNC
    ========================================================= */
    function toggleHardware(key) {
      playClick(440, 0.04);
      hwPrefs[key] = !hwPrefs[key];
      const sw = document.getElementById('sw-' + key);
      if (sw) sw.classList.toggle('on', hwPrefs[key]);

      if (key === 'scanlines') {
        document.body.classList.toggle('scanlines-enabled', hwPrefs.scanlines);
      } else if (key === 'dimmer') {
        document.getElementById('bridge-shell').classList.toggle('dimmed', hwPrefs.dimmer);
      }
    }

    async function pushToGist() {
      playClick(640, 0.05);
      const gistId = document.getElementById('gist-id-input').value.trim() || DEFAULT_GIST_ID;
      const token = document.getElementById('gist-token-input').value.trim();
      const statusEl = document.getElementById('sync-status-msg');

      localStorage.setItem('astra_gist_id', gistId);
      if (token) localStorage.setItem('astra_gist_token', token);

      if (!token) {
        statusEl.textContent = 'ERROR: ENTER GITHUB TOKEN FIRST';
        return;
      }

      statusEl.textContent = 'UPLOADING TELEMETRY TO GIST...';
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            files: {
              [GIST_FILENAME]: {
                content: JSON.stringify(gameState, null, 2)
              }
            }
          })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        statusEl.textContent = `SYNCED OK (${new Date().toLocaleTimeString()})`;
        appendLog('PUSHED SAVE TO GITHUB GIST.');
      } catch (err) {
        statusEl.textContent = `UPLINK FAILED: ${err.message}`;
      }
    }

    async function pullFromGist() {
      playClick(540, 0.05);
      const gistId = document.getElementById('gist-id-input').value.trim() || DEFAULT_GIST_ID;
      const token = document.getElementById('gist-token-input').value.trim();
      const statusEl = document.getElementById('sync-status-msg');

      statusEl.textContent = 'DOWNLOADING FROM GIST...';
      try {
        const headers = { 'Accept': 'application/vnd.github+json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const file = data.files && data.files[GIST_FILENAME];
        if (!file || !file.content) throw new Error('astra_station_save.json not found');

        const remoteState = JSON.parse(file.content);
        gameState = {
          ...structuredClone(DEFAULT_STATE),
          ...remoteState,
          vitals: { ...DEFAULT_STATE.vitals, ...(remoteState.vitals || {}) }
        };
        saveGameState();
        renderVitalsStrip();
        renderMainCRT();
        statusEl.textContent = `RESTORED OK (${new Date().toLocaleTimeString()})`;
        appendLog('RESTORED SAVE FROM GITHUB GIST.');
      } catch (err) {
        statusEl.textContent = `DOWNLINK FAILED: ${err.message}`;
      }
    }

    function exportSaveJSON() {
      playClick(600, 0.04);
      const blob = new Blob([JSON.stringify(gameState, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = GIST_FILENAME;
      a.click();
    }

    /* =========================================================
       8. PANORAMIC ORBITAL VIEWPORT CANVAS RENDERER
    ========================================================= */
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let shuttleX = -60;
    let radarAngle = 0;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = Math.max(240, Math.floor(rect.width / 2));
      canvas.height = Math.max(70, Math.floor(rect.height / 2));
      stars = Array.from({ length: 65 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height * 0.75,
        size: Math.random() > 0.82 ? 2 : 1,
        blink: Math.random() * Math.PI * 2
      }));
    }

    function setViewportMode(mode) {
      playClick(560, 0.04);
      viewportMode = mode;
      document.getElementById('btn-view-orbit').classList.toggle('active', mode === 'orbit');
      document.getElementById('btn-view-radar').classList.toggle('active', mode === 'radar');
    }

    function drawViewport(t) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#02050a');
      bg.addColorStop(1, '#071526');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      stars.forEach(s => {
        const alpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.0015 + s.blink));
        ctx.fillStyle = `rgba(210, 240, 255, ${alpha})`;
        ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);
      });

      if (viewportMode === 'orbit') {
        const earthX = w * 0.52;
        const earthY = h * 2.55;
        const earthR = h * 2.15;

        const atmo = ctx.createRadialGradient(earthX, earthY, earthR * 0.96, earthX, earthY, earthR * 1.05);
        atmo.addColorStop(0, 'rgba(56, 242, 255, 0.55)');
        atmo.addColorStop(0.5, 'rgba(26, 130, 214, 0.25)');
        atmo.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = atmo;
        ctx.beginPath();
        ctx.arc(earthX, earthY, earthR * 1.05, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0d4f8b';
        ctx.beginPath();
        ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
        ctx.clip();

        ctx.fillStyle = '#7ce0ff';
        const drift = (t * 0.008) % w;
        for (let i = -1; i <= 2; i++) {
          const cx = i * 140 + drift;
          const cy = h * 0.55;
          ctx.fillRect(cx, cy, 55, 5);
          ctx.fillRect(cx + 18, cy + 8, 70, 4);
          ctx.fillRect(cx - 10, cy + 16, 48, 6);
        }
        ctx.restore();

        shuttleX += 0.18;
        if (shuttleX > w + 60) shuttleX = -60;
        const sy = Math.floor(h * 0.34);
        const sx = Math.floor(shuttleX);
        ctx.fillStyle = '#2b3e52';
        ctx.fillRect(sx, sy, 22, 5);
        ctx.fillRect(sx + 5, sy - 3, 10, 3);
        ctx.fillStyle = '#ffb000';
        ctx.fillRect(sx - 2, sy + 1, 2, 3);
      } else {
        const cx = Math.floor(w / 2);
        const cy = Math.floor(h / 2);
        const maxR = Math.min(w, h) * 0.42;

        ctx.strokeStyle = 'rgba(56, 242, 255, 0.32)';
        ctx.lineWidth = 1;
        [0.33, 0.66, 1].forEach(m => {
          ctx.beginPath();
          ctx.arc(cx, cy, maxR * m, 0, Math.PI * 2);
          ctx.stroke();
        });

        radarAngle += 0.025;
        ctx.strokeStyle = '#38f2ff';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(radarAngle) * maxR, cy + Math.sin(radarAngle) * maxR);
        ctx.stroke();

        ctx.fillStyle = '#ffb000';
        ctx.fillRect(cx + 24, cy - 14, 3, 3);
        ctx.fillRect(cx - 32, cy + 12, 3, 3);
      }

      requestAnimationFrame(drawViewport);
    }

    /* =========================================================
       9. HUD INITIALIZATION
    ========================================================= */
    function updateTopHUD() {
      document.getElementById('hud-lvl').textContent = gameState.level;
      document.getElementById('hud-credits').textContent = gameState.credits;
      const pct = Math.min(100, Math.round((gameState.xp / (gameState.level * 100)) * 100));
      document.getElementById('hud-xp-bar').style.width = pct + '%';
    }

    setInterval(() => {
      document.getElementById('hud-clock').textContent = new Date().toLocaleTimeString([], { hour12: false });
      applyVitalsDecay();
      renderVitalsStrip();
    }, 1000);

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    applyVitalsDecay();
    updateTopHUD();
    renderVitalsStrip();
    renderMainCRT();
    requestAnimationFrame(drawViewport);
  </script>
</body>
