<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1016" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Astra Station" />
  <title>ASTRA STATION // BRIDGE CONSOLE v3</title>
  <link rel="icon" type="image/jpeg" href="./astra-station+icon.jpeg" />
  <link rel="apple-touch-icon" href="./astra-station+icon.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --hull-dark: #090d14;
      --hull-mid: #141d2b;
      --hull-plate: #1c283b;
      --hull-highlight: #324663;
      --hull-trim: #06090f;

      /* Color-Coordinated Vital Phosphors */
      --v-oxygen: #38f2ff;
      --v-power: #ffb000;
      --v-shields: #6ea8ff;
      --v-bio: #3dff8b;
      --v-morale: #ff6ec7;
      --v-earth: #b388ff;
      --crt-red: #ff3b4e;

      --font-pixel: 'Press Start 2P', monospace;
      --font-term: 'VT323', monospace;
      --font-tech: 'Share Tech Mono', monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      height: 100dvh;
      background: #04060a;
      color: #d8f4ff;
      font-family: var(--font-tech);
      overflow: hidden;
    }

    /* =========================================================
       MAIN BRIDGE CHASSIS
    ========================================================= */
    #bridge-shell {
      display: grid;
      grid-template-rows:
        40px
        minmax(126px, 22vh)
        auto
        minmax(0, 1fr)
        56px;
      width: 100%;
      max-width: 1120px;
      height: 100dvh;
      margin: 0 auto;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      background: linear-gradient(180deg, #0d141f 0%, #162030 50%, #0b1018 100%);
      border-left: 2px solid var(--hull-trim);
      border-right: 2px solid var(--hull-trim);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
    }

    #bridge-shell.dimmed::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(2, 5, 12, 0.45);
      pointer-events: none;
      z-index: 999;
    }

    /* =========================================================
       1. OVERHEAD BULKHEAD & COMMANDER HUD
    ========================================================= */
    .overhead-bulkhead {
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 12px),
        linear-gradient(180deg, #090d14 0%, #1a2536 88%, #070a10 100%);
      border-bottom: 2px solid #05080d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      gap: 6px;
      width: 100%;
      min-width: 0;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .lamp-bank {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
    }

    .recessed-lamp {
      width: 14px;
      height: 4px;
      background: var(--v-power);
      box-shadow: 0 0 8px var(--v-power);
      border-radius: 1px;
    }

    .recessed-lamp.cyan {
      background: var(--v-oxygen);
      box-shadow: 0 0 8px var(--v-oxygen);
    }

    .recessed-lamp.alert {
      background: var(--crt-red);
      box-shadow: 0 0 10px var(--crt-red);
      animation: strobe 0.75s infinite alternate;
    }

    @keyframes strobe {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .station-id-plate {
      background: #0a0f17;
      border: 1.5px solid var(--hull-highlight);
      box-shadow: inset 0 0 8px #000;
      padding: 2px 7px 2px 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .station-emblem {
      width: 20px;
      height: 20px;
      border: 1px solid var(--v-power);
      border-radius: 2px;
      object-fit: cover;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .station-title-txt {
      font-family: var(--font-pixel);
      font-size: 7.5px;
      color: var(--v-power);
      text-shadow: 0 0 6px rgba(255, 176, 0, 0.45);
    }

    .top-telemetry-strip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      flex-shrink: 0;
    }

    .hud-pill {
      background: #060a10;
      border: 1px solid #2e425c;
      padding: 2px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--v-oxygen);
      white-space: nowrap;
      box-shadow: inset 0 0 6px #000;
    }

    .hud-pill strong {
      color: var(--v-power);
      font-weight: normal;
    }

    .xp-mini-track {
      width: 36px;
      height: 6px;
      background: #0b161c;
      border: 1px solid #1e5663;
      overflow: hidden;
    }

    .xp-mini-fill {
      height: 100%;
      background: linear-gradient(90deg, #1cb5e0, #38f2ff);
      box-shadow: 0 0 6px var(--v-oxygen);
      transition: width 0.35s ease;
    }

    /* =========================================================
       2. EDGE-TO-EDGE 4-PANE COMMAND OBSERVATORY WINDOW
    ========================================================= */
    .observatory-bay {
      position: relative;
      background: #03050a;
      border-bottom: 3px solid #090e16;
      overflow: hidden;
      width: 100%;
      min-width: 0;
    }

    #space-canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .viewport-controls {
      position: absolute;
      top: 6px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 5;
      pointer-events: none;
    }

    .viewport-tag {
      background: rgba(6, 11, 18, 0.88);
      border: 1px solid #354d6b;
      padding: 2px 7px;
      font-size: 10px;
      color: #a9d6f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }

    .viewport-tag.hazard-active {
      border-color: var(--crt-red);
      color: #ff9aa4;
      background: rgba(45, 8, 14, 0.92);
      animation: strobe 0.8s infinite alternate;
    }

    .viewport-lever-box {
      pointer-events: auto;
      background: #131c29;
      border: 1px solid #354d6b;
      padding: 2px 4px;
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .lever-btn {
      background: #080d14;
      border: 1px solid #264954;
      color: #8ccad4;
      font-family: var(--font-tech);
      font-size: 10px;
      padding: 2px 5px;
      cursor: pointer;
    }

    .lever-btn.active {
      background: var(--v-oxygen);
      color: #031014;
      font-weight: bold;
      border-color: var(--v-oxygen);
    }

    /* =========================================================
       3. COLOR-CODED 6-VITAL INSTRUMENT PANEL
    ========================================================= */
    .instrument-deck {
      background: linear-gradient(180deg, #1e2b3d 0%, #131c29 100%);
      border-top: 1px solid #3b516e;
      border-bottom: 2px solid #080c12;
      padding: 5px 7px;
      width: 100%;
      min-width: 0;
    }

    .instrument-bezel {
      background: #070b11;
      border: 2px solid #27374d;
      border-radius: 6px;
      padding: 5px 6px;
      box-shadow: inset 0 0 16px #000;
      position: relative;
    }

    .vitals-matrix {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px 6px;
      width: 100%;
    }

    .vital-gauge-card {
      background: rgba(15, 22, 33, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 3px solid var(--vc, #38f2ff);
      border-radius: 3px;
      padding: 3px 5px;
      cursor: pointer;
      min-width: 0;
      transition: background 0.15s ease;
    }

    .vital-gauge-card:hover, .vital-gauge-card.selected {
      background: rgba(28, 42, 62, 0.95);
    }

    .vg-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      line-height: 1.1;
      margin-bottom: 3px;
      color: var(--vc, #38f2ff);
      white-space: nowrap;
    }

    .vg-title {
      display: flex;
      align-items: center;
      gap: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vg-bar-cells {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 1.5px;
      height: 6px;
      background: #04070b;
      padding: 1px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .vg-cell { background: rgba(255, 255, 255, 0.07); }
    .vg-cell.lit { background: var(--vc, #38f2ff); box-shadow: 0 0 4px var(--vc, #38f2ff); }
    .vg-cell.crit { background: var(--crt-red); box-shadow: 0 0 5px var(--crt-red); }

    .vital-inspector-bar {
      margin-top: 5px;
      padding-top: 4px;
      border-top: 1px dashed #2a3d54;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #a4c6e0;
    }

    /* =========================================================
       4. PRIMARY RECESSED CRT WORKSTATION SCREEN
    ========================================================= */
    .main-console-bay {
      padding: 6px 7px;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .crt-bezel {
      flex: 1;
      width: 100%;
      background: #080c12;
      border: 3px solid #26364a;
      border-radius: 8px;
      padding: 2px;
      box-shadow: inset 0 0 18px #000, 0 2px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .scanlines-enabled .crt-bezel::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 6px;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 4;
    }

    .crt-screen {
      flex: 1;
      width: 100%;
      background: radial-gradient(circle at center, #081821 0%, #03080d 100%);
      border-radius: 6px;
      padding: 8px;
      color: #d6f7ff;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: inset 0 0 26px rgba(0, 0, 0, 0.95);
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .crt-screen.amber-mode {
      background: radial-gradient(circle at center, #1a1205 0%, #070501 100%);
      color: var(--v-power);
    }

    .crt-screen::-webkit-scrollbar { width: 4px; }
    .crt-screen::-webkit-scrollbar-track { background: #04070a; }
    .crt-screen::-webkit-scrollbar-thumb { background: #2c4c5e; border-radius: 2px; }

    /* Terminal Header Bar */
    .term-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #224654;
      padding-bottom: 5px;
      margin-bottom: 8px;
      gap: 6px;
      width: 100%;
      min-width: 0;
      flex-shrink: 0;
    }

    .term-title {
      font-family: var(--font-pixel);
      font-size: 8px;
      line-height: 1.4;
      color: var(--v-oxygen);
      text-shadow: 0 0 6px rgba(56, 242, 255, 0.35);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .term-action-btn {
      background: rgba(56, 242, 255, 0.14);
      border: 1px solid var(--v-oxygen);
      color: var(--v-oxygen);
      font-family: var(--font-tech);
      font-size: 12px;
      padding: 3px 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .term-action-btn:hover, .term-action-btn:active {
      background: var(--v-oxygen);
      color: #031014;
      font-weight: bold;
    }

    /* Hazard Alert Banner inside CRT */
    .hazard-banner {
      background: rgba(255, 59, 78, 0.14);
      border: 1px solid var(--crt-red);
      padding: 7px 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #ffb8bf;
      flex-shrink: 0;
    }

    /* =========================================================
       HOME SCREEN: LARGE ILLUSTRATED STATION LOUNGE
    ========================================================= */
    .lounge-hero-wrap {
      flex: 1;
      min-height: 215px;
      border: 2px solid #2c4459;
      background: #050a12;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    #lounge-canvas {
      width: 100%;
      height: 100%;
      flex: 1;
      display: block;
      image-rendering: pixelated;
    }

    .lounge-hud-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      margin-top: 7px;
      flex-shrink: 0;
    }

    .lounge-stat-box {
      background: rgba(10, 20, 30, 0.85);
      border: 1px solid #234254;
      padding: 5px 6px;
      font-size: 11px;
    }

    .lounge-stat-box strong {
      display: block;
      font-size: 13px;
      color: var(--v-power);
      margin-top: 1px;
    }

    /* =========================================================
       DECK 02: PROTOCOLS + TELEMETRY COMBINED
    ========================================================= */
    .subview-switch-bar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .subview-btn {
      background: #09131c;
      border: 1px solid #284b5c;
      color: #7eb8c2;
      font-family: var(--font-tech);
      font-size: 12px;
      padding: 5px;
      cursor: pointer;
      text-align: center;
    }

    .subview-btn.active {
      background: rgba(56, 242, 255, 0.16);
      border-color: var(--v-oxygen);
      color: var(--v-oxygen);
      font-weight: bold;
    }

    .protocol-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 8px;
      width: 100%;
    }

    .protocol-module {
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-left: 4px solid var(--vc, #38f2ff);
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(5,12,18,0.65) 100%);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      min-width: 0;
      border-radius: 3px;
    }

    .protocol-module.logged-today {
      box-shadow: inset 0 0 12px rgba(61, 255, 139, 0.12);
      border-color: rgba(61, 255, 139, 0.45);
    }

    .proto-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
    }

    .proto-name {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      word-break: break-word;
      min-width: 0;
    }

    .proto-vital-badge {
      font-size: 10px;
      padding: 2px 5px;
      border: 1px solid var(--vc, #38f2ff);
      color: var(--vc, #38f2ff);
      background: rgba(0, 0, 0, 0.45);
      text-transform: uppercase;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .proto-effect-line {
      font-size: 11.5px;
      color: #9ec5d6;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
    }

    .yield-pill {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 2px;
      background: rgba(255, 176, 0, 0.14);
      border: 1px solid rgba(255, 176, 0, 0.4);
      color: var(--v-power);
    }

    .yield-pill.capped {
      background: rgba(255, 59, 78, 0.16);
      border-color: var(--crt-red);
      color: #ff9aa4;
    }

    .proto-controls {
      display: flex;
      gap: 5px;
      width: 100%;
    }

    .decrement-btn {
      background: rgba(255, 176, 0, 0.12);
      border: 1px solid #8a6214;
      color: var(--v-power);
      font-family: var(--font-tech);
      font-size: 15px;
      font-weight: bold;
      padding: 0 11px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .decrement-btn:active {
      background: var(--v-power);
      color: #050505;
    }

    .engage-switch {
      flex: 1;
      min-width: 0;
      background: rgba(8, 28, 36, 0.9);
      border: 1px solid var(--vc, #38f2ff);
      color: var(--vc, #38f2ff);
      font-family: var(--font-tech);
      font-size: 13px;
      padding: 5px 6px;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
    }

    .engage-switch:hover, .engage-switch:active {
      background: var(--vc, #38f2ff);
      color: #030a0e;
    }

    .icon-sq-btn {
      background: rgba(12, 20, 30, 0.8);
      border: 1px solid #354d66;
      color: #9cb8d4;
      font-family: var(--font-tech);
      font-size: 12px;
      padding: 0 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-sq-btn.del {
      border-color: #572830;
      color: #d46a78;
    }

    /* Telemetry Visualizations */
    .kpi-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 8px;
    }

    .kpi-card {
      background: rgba(8, 20, 30, 0.8);
      border: 1px solid #1f4454;
      padding: 6px 8px;
    }

    .kpi-card span {
      font-size: 10.5px;
      color: #7eb8c2;
      display: block;
    }

    .kpi-card strong {
      font-size: 16px;
      color: var(--v-oxygen);
    }

    .telemetry-bars {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(18px, 1fr));
      gap: 4px;
      align-items: end;
      height: 88px;
      padding: 6px;
      border: 1px solid #1f4454;
      background: rgba(0, 0, 0, 0.4);
      margin-bottom: 8px;
      width: 100%;
    }

    .t-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 2px;
      min-width: 0;
    }

    .t-bar {
      width: 100%;
      max-width: 20px;
      background: linear-gradient(180deg, #38f2ff, #167a8c);
      box-shadow: 0 0 6px rgba(56, 242, 255, 0.35);
      min-height: 3px;
    }

    .t-lbl {
      font-size: 9px;
      color: #7eb8c2;
    }

    .dist-row {
      margin-bottom: 5px;
      font-size: 11.5px;
    }

    .dist-track {
      height: 7px;
      background: #061017;
      border: 1px solid #1e3847;
      margin-top: 2px;
      overflow: hidden;
    }

    .dist-fill {
      height: 100%;
      transition: width 0.3s ease;
    }

    .earth-tiles-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 8px;
    }

    .earth-tile {
      border: 1px solid rgba(179, 136, 255, 0.4);
      background: rgba(179, 136, 255, 0.06);
      padding: 6px;
      cursor: pointer;
    }

    .log-stream {
      font-family: var(--font-term);
      font-size: 15px;
      line-height: 1.3;
      color: #9be8f0;
    }

    .log-entry {
      padding: 3px 0;
      border-bottom: 1px dotted rgba(56, 242, 255, 0.15);
      word-break: break-word;
    }

    /* Quartermaster Shop Cards */
    .section-subhead {
      font-size: 11px;
      color: var(--v-power);
      letter-spacing: 0.8px;
      margin: 8px 0 5px;
      border-bottom: 1px dashed rgba(255, 176, 0, 0.3);
      padding-bottom: 2px;
    }

    .qm-item {
      border: 1px solid #224454;
      border-left: 3px solid var(--vc, #ffb000);
      padding: 7px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: rgba(10, 22, 32, 0.7);
      width: 100%;
    }

    .qm-tier-tag {
      font-size: 9.5px;
      padding: 1px 4px;
      border: 1px solid currentColor;
      margin-left: 4px;
    }

    /* Config / Settings Tab (Classes, Achievements, Switches, Gist) */
    .class-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 8px;
      width: 100%;
    }

    .class-card {
      border: 1px solid #593e08;
      padding: 6px;
      cursor: pointer;

       2. PERSISTENCE, LEVEL CURVE & DIMINISHING RETURNS

    const DEFAULT_GIST_ID = '801f264895fb9e4c5d5130684e259088';

      level: 1,
      xp: 0,
      credits: 150,
      playerClass: 'Flight Engineer',
      lastDecayTimestamp: Date.now(),

        oxygen: 88,
        power: 92,
        shields: 90,

        morale: 82,

    function xpRequiredForLevel(lvl) {
      return Math.floor(150 * Math.pow(lvl, 1.45));
    }

    // Diminishing returns multiplier based on how many times THIS habit was already logged today
    function getDiminishingTier(todayCount) {
      if (todayCount < 2)  return { mult: 1.00, label: '100% YIELD', capped: false };
      if (todayCount < 5)  return { mult: 0.40, label: '40% YIELD',  capped: false };
      if (todayCount < 8)  return { mult: 0.15, label: '15% YIELD',  capped: false };
      if (todayCount < 10) return { mult: 0.05, label: '5% YIELD',   capped: false };
      return                      { mult: 0.00, label: 'DAILY CAP',  capped: true };
    }

    function totalLogsCount(state = gameState) {
      return (state.habits || []).reduce((sum, h) => sum + (h.count || 0), 0);
    }

    function ownedFurnitureCount(state = gameState) {
      return (state.ownedItems || []).filter(id => LOUNGE_CATALOG.some(f => f.id === id)).length;
    }

    function uniqueActiveDays(state = gameState) {
      const days = new Set();
      (state.habits || []).forEach(h => {
        if (h.history) {
          Object.entries(h.history).forEach(([k, v]) => { if (v > 0) days.add(k); });
        }
      });
      return days.size;
    }

    function subsystemsLoggedToday(state = gameState) {
      const day = todayKey();
      const set = new Set();
      (state.habits || []).forEach(h => {
        if (h.history && h.history[day] > 0 && h.vital) set.add(h.vital);
      });
      return set.size;
    }

        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(DEFAULT_STATE),
          ...parsed,
          vitals: { ...DEFAULT_STATE.vitals, ...(parsed.vitals || {}) },
          habits: Array.isArray(parsed.habits) && parsed.habits.length ? parsed.habits : structuredClone(DEFAULT_STATE.habits),
          ownedItems: Array.isArray(parsed.ownedItems) ? parsed.ownedItems : ['furn-espresso'],
          achievements: Array.isArray(parsed.achievements) ? parsed.achievements : ['first-orbit'],
          earthTiles: Array.isArray(parsed.earthTiles) && parsed.earthTiles.length ? parsed.earthTiles : structuredClone(DEFAULT_STATE.earthTiles),
          logs: Array.isArray(parsed.logs) ? parsed.logs.slice(0, 40) : structuredClone(DEFAULT_STATE.logs)
        };
      } catch (e) {
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveGameState() {
      checkAchievements();
      const serialized = JSON.stringify(gameState);
      localStorage.setItem(STORAGE_KEY, serialized);
      localStorage.setItem(LEGACY_KEY, serialized);
      updateTopHUD();
    }

    function checkAchievements() {
      ACHIEVEMENTS_LIST.forEach(a => {
        if (!gameState.achievements.includes(a.id) && a.check(gameState)) {
          gameState.achievements.push(a.id);
          appendLog(`ACHIEVEMENT UNLOCKED: ${a.name.toUpperCase()}!`);
        }
      });
    }

    function todayKey() {
      return new Date().toISOString().slice(0, 10);
    }

    function appendLog(msg) {
      const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      gameState.logs.unshift(`[${stamp}] ${msg}`);
      if (gameState.logs.length > 40) gameState.logs.pop();
    }

    /* =========================================================
       3. HOURLY VITALS DECAY & RANDOM SPACE HAZARDS
    ========================================================= */
    function applyVitalsDecay() {
      const now = Date.now();
      const last = gameState.lastDecayTimestamp || now;
      const elapsedHours = (now - last) / (1000 * 60 * 60);

      if (elapsedHours >= 0.05) {
        const hour = new Date().getHours();
        const isNightCycle = hour >= 0 && hour < 5;
        const ratePerHour = isNightCycle ? 1.5 : 3.0;
        const drop = elapsedHours * ratePerHour;

        Object.keys(gameState.vitals).forEach(k => {
          gameState.vitals[k] = Math.max(0, +(gameState.vitals[k] - drop).toFixed(1));
        });
        gameState.lastDecayTimestamp = now;
        saveGameState();
      }
    }

    function triggerHazard() {
      const h = HAZARDS_POOL[Math.floor(Math.random() * HAZARDS_POOL.length)];
      gameState.activeHazard = { ...h, triggeredAt: Date.now() };
      gameState.vitals[h.vital] = Math.max(0, +(gameState.vitals[h.vital] - h.dmg).toFixed(1));
      playClick(220, 0.16, 'sawtooth');
      appendLog(`ALERT: ${h.title} (-${h.dmg}% ${h.vital.toUpperCase()})`);
      saveGameState();
      renderVitalsMatrix();
      renderMainCRT();
      if (activeDeck === 'home') requestAnimationFrame(drawLoungeScene);
    }

    /* =========================================================
       4. TACTILE SYNTH AUDIO
    ========================================================= */
    let audioCtx = null;
    function playClick(freq = 520, duration = 0.04, type = 'square') {
      if (!hwPrefs.audio) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.045, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (_) {}
    }

    /* =========================================================
       5. HABIT PROTOCOL ENGAGEMENT, DECREMENT & CRUD
    ========================================================= */
    function resolveHabitVital(habit) {
      if (habit.vital && VITAL_META[habit.vital]) return habit.vital;
      return Object.keys(gameState.vitals).reduce((a, b) =>
        gameState.vitals[a] <= gameState.vitals[b] ? a : b
      );
    }

    function computeRewardForHabit(habit, todayCountBefore) {
      const vKey = resolveHabitVital(habit);
      const tier = getDiminishingTier(todayCountBefore);
      const hasFurnBonus = gameState.ownedItems.some(id => {
        const item = LOUNGE_CATALOG.find(f => f.id === id);
        return item && item.vital === vKey;
      });
      const baseCredits = (gameState.playerClass === 'Quartermaster' ? 18 : 12) + (hasFurnBonus ? 2 : 0);
      const baseXp = gameState.playerClass === 'Flight Engineer' ? 30 : 24;

      const credits = tier.capped ? 0 : Math.max(tier.mult > 0 ? 1 : 0, Math.round(baseCredits * tier.mult));
      const xp = tier.capped ? 0 : Math.max(tier.mult > 0 ? 1 : 0, Math.round(baseXp * tier.mult));
      const vitalBoost = tier.capped ? 2 : Math.max(3, Math.round(15 * tier.mult));
      return { credits, xp, vitalBoost, tier, vKey };
    }

    function engageProtocol(habitId) {
      const habit = gameState.habits.find(h => h.id === habitId);
      if (!habit) return;

      playClick(680, 0.06, 'triangle');
      const day = todayKey();
      habit.history = habit.history || {};
      const prevToday = habit.history[day] || 0;
      const { credits, xp, vitalBoost, tier, vKey } = computeRewardForHabit(habit, prevToday);

      habit.count = (habit.count || 0) + 1;
      habit.lastLogged = Date.now();
      habit.history[day] = prevToday + 1;

      selectedVital = vKey;
      gameState.vitals[vKey] = Math.min(100, +(gameState.vitals[vKey] + vitalBoost).toFixed(1));

      let hazardMsg = '';
      if (gameState.activeHazard && gameState.activeHazard.vital === vKey) {
        hazardMsg = ` // ${gameState.activeHazard.title} RESOLVED!`;
        gameState.activeHazard = null;
      }

      gameState.credits += credits;
      gameState.xp += xp;

      let needed = xpRequiredForLevel(gameState.level);
      while (gameState.xp >= needed) {
        gameState.xp -= needed;
        gameState.level += 1;
        needed = xpRequiredForLevel(gameState.level);
        playClick(880, 0.14, 'square');
        appendLog(`PROMOTION! COMMANDER LEVEL ${gameState.level}${hazardMsg}`);
      }
      if (xp > 0 || credits > 0) {
        appendLog(`${habit.name} [${tier.label}]: +${vitalBoost}% ${VITAL_META[vKey].label}, +${xp}XP, +${credits}⎈${hazardMsg}`);
      } else {
        appendLog(`${habit.name} [DAILY CAP]: Tally +1 (+${vitalBoost}% ${VITAL_META[vKey].label}, 0⎈)${hazardMsg}`);
      }

      saveGameState();
      renderVitalsMatrix();
      renderMainCRT();
    }

    function decrementProtocol(habitId) {
      const habit = gameState.habits.find(h => h.id === habitId);
      if (!habit) return;

      const day = todayKey();
      habit.history = habit.history || {};
      const curToday = habit.history[day] || 0;

      if (curToday <= 0 && (habit.count || 0) <= 0) {
        playClick(200, 0.05);
        return;
      }

      playClick(340, 0.05, 'sawtooth');
      const countBeforeLastLog = Math.max(0, curToday - 1);
      const { credits, xp, vitalBoost, vKey } = computeRewardForHabit(habit, countBeforeLastLog);

      if (curToday > 0) {
        habit.history[day] = curToday - 1;
      }
      habit.count = Math.max(0, (habit.count || 0) - 1);

      gameState.vitals[vKey] = Math.max(0, +(gameState.vitals[vKey] - vitalBoost).toFixed(1));
      gameState.credits = Math.max(0, gameState.credits - credits);
      gameState.xp = Math.max(0, gameState.xp - xp);

      appendLog(`REVERTED: ${habit.name} (-1 tally, -${credits}⎈, -${xp}XP)`);
      saveGameState();
      renderVitalsMatrix();
      renderMainCRT();
    }

    function openProtocolModal(habitId = null) {

      const modal = document.getElementById('protocol-modal');

      const nameField = document.getElementById('new-habit-name');

      if (habitId) {
        const h = gameState.habits.find(x => x.id === habitId);
        if (!h) return;
        heading.textContent = 'EDIT STATION PROTOCOL';
        idField.value = h.id;
        nameField.value = h.name;
        vitalField.value = h.vital && VITAL_META[h.vital] ? h.vital : 'oxygen';
      } else {
        heading.textContent = '+ REGISTER STATION PROTOCOL';
        idField.value = '';
        nameField.value = '';
        vitalField.value = 'oxygen';
      }

      modal.classList.add('open');

    function closeProtocolModal() {
      playClick(360, 0.04);
      document.getElementById('protocol-modal').classList.remove('open');
    }

    function saveProtocolModal() {
      const editId = document.getElementById('edit-habit-id').value;
      const name = document.getElementById('new-habit-name').value.trim();
      const vital = document.getElementById('new-habit-vital').value;
      if (!name) return;

      if (editId) {
        const existing = gameState.habits.find(h => h.id === editId);
        if (existing) {
          existing.name = name;
          existing.vital = vital;
          appendLog(`UPDATED PROTOCOL: ${name} -> ${VITAL_META[vital].label}`);
        }
      } else {
        gameState.habits.push({
          id: 'h_' + Date.now(),
          name,
          vital,
          count: 0,
          lastLogged: null,
          history: {}
        });
        appendLog(`REGISTERED: ${name} (${VITAL_META[vital].label})`);
      }

      closeProtocolModal();
      saveGameState();
      renderMainCRT();
    }

      playClick(280, 0.05);
      gameState.habits = gameState.habits.filter(h => h.id !== id);
      appendLog('PROTOCOL DECOMMISSIONED.');
      saveGameState();
      renderMainCRT();
    }

      const matrix = document.getElementById('vitals-matrix');

      matrix.innerHTML = keys.map(k => {
        const meta = VITAL_META[k];

        const litCount = Math.round((val / 100) * 10);
        let cells = '';
        for (let i = 0; i < 10; i++) {
          const cls = i < litCount ? (val < 25 ? 'vg-cell crit' : 'vg-cell lit') : 'vg-cell';
          cells += `<div class="${cls}"></div>`;
        }
        return `
          <div class="vital-gauge-card ${selectedVital === k ? 'selected' : ''}"
               style="--vc:${meta.color}"
               onclick="inspectVital('${k}')">

            </div>

          </div>

      const info = VITAL_META[selectedVital] || VITAL_META.oxygen;

      document.getElementById('vital-inspector').innerHTML = `
        <span style="color:${info.color}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          ${info.icon} <strong>${info.label}:</strong> ${info.desc}

    async function pushToGist() {
      playClick(640, 0.05);
      const gistId = document.getElementById('gist-id-input').value.trim() || DEFAULT_GIST_ID;
      const token = document.getElementById('gist-token-input').value.trim();
      const statusEl = document.getElementById('sync-status-msg');

      localStorage.setItem('astra_gist_id', gistId);
      if (token) localStorage.setItem('astra_gist_token', token);

      if (!token) {
        statusEl.textContent = 'ERROR: ENTER GITHUB TOKEN FIRST';
        return;
      }

      statusEl.textContent = 'UPLOADING TELEMETRY TO GIST...';
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            files: {
              [GIST_FILENAME]: {
                content: JSON.stringify(gameState, null, 2)
              }
            }
          })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        statusEl.textContent = `SYNCED OK (${new Date().toLocaleTimeString()})`;
        appendLog('PUSHED SAVE TO GITHUB GIST.');
      } catch (err) {
        statusEl.textContent = `UPLINK FAILED: ${err.message}`;
      }
    }

    async function pullFromGist() {
      playClick(540, 0.05);
      const gistId = document.getElementById('gist-id-input').value.trim() || DEFAULT_GIST_ID;
      const token = document.getElementById('gist-token-input').value.trim();
      const statusEl = document.getElementById('sync-status-msg');

      statusEl.textContent = 'DOWNLOADING FROM GIST...';
      try {
        const headers = { 'Accept': 'application/vnd.github+json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const file = data.files && data.files[GIST_FILENAME];
        if (!file || !file.content) throw new Error('astra_station_save.json not found');

        const remoteState = JSON.parse(file.content);
        gameState = {
          ...structuredClone(DEFAULT_STATE),
          ...remoteState,
          vitals: { ...DEFAULT_STATE.vitals, ...(remoteState.vitals || {}) }
        };
        saveGameState();
        renderVitalsMatrix();
        renderMainCRT();
        statusEl.textContent = `RESTORED OK (${new Date().toLocaleTimeString()})`;
        appendLog('RESTORED SAVE FROM GITHUB GIST.');
      } catch (err) {
        statusEl.textContent = `DOWNLINK FAILED: ${err.message}`;
      }
    }

    function drawDitheredPlanet(cx, cy, r, hasRing) {
      ctx.fillStyle = '#4e5d73';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = '#182130';
      ctx.beginPath();
      ctx.arc(cx + r * 0.45, cy + r * 0.2, r * 0.95, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#8fa3bf';
      for (let y = -r; y < r; y += 3) {
        for (let x = -r; x < r; x += 3) {
          if ((x + y) % 6 === 0 && x < 0) ctx.fillRect(cx + x, cy + y, 1, 1);
        }
      }
      ctx.restore();

      if (hasRing) {
        ctx.strokeStyle = '#c8d6e8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, r * 1.9, r * 0.42, -0.25, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // 4-Pane Edge-to-Edge Angled Windows (Far-Left, Center-Left, Center-Right, Far-Right)
    function drawCockpitFrame(w, h) {
      ctx.fillStyle = '#1a2638';
      ctx.fillRect(0, 0, w, 6);
      ctx.fillRect(0, h - 6, w, 6);

      // Left & Right thin outer hull edges
      ctx.fillRect(0, 0, 4, h);
      ctx.fillRect(w - 4, 0, 4, h);

      // Angled Strut 1 (separates Far-Left angled window from Center-Left window)
      ctx.strokeStyle = '#1f2e45';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(w * 0.19, 0); ctx.lineTo(w * 0.24, h);
      ctx.stroke();

      // Center Mullion (separates Center-Left from Center-Right)
      ctx.fillStyle = '#1f2e45';
      ctx.fillRect(Math.floor(w * 0.495), 0, 4, h);

      // Angled Strut 2 (separates Center-Right from Far-Right angled window)
      ctx.beginPath();
      ctx.moveTo(w * 0.81, 0); ctx.lineTo(w * 0.76, h);
      ctx.stroke();

      // Specular metallic highlights on angled struts
      ctx.strokeStyle = '#3f5980';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(w * 0.19, 0); ctx.lineTo(w * 0.24, h);
      ctx.moveTo(w * 0.81, 0); ctx.lineTo(w * 0.76, h);
      ctx.stroke();

      // Status lamps on struts
      ctx.fillStyle = gameState.activeHazard ? '#ff3b4e' : '#ffb000';
      ctx.fillRect(Math.floor(w * 0.205), 14, 5, 3);
      ctx.fillRect(Math.floor(w * 0.785), 14, 5, 3);
    }

    // Artemis-III Inspired Mission Trajectory Visualization
    function drawTrajectoryMap(w, h, t) {
      const earthX = Math.floor(w * 0.22);
      const earthY = Math.floor(h * 0.56);
      const earthR = Math.max(12, Math.floor(h * 0.22));

      const moonX = Math.floor(w * 0.76);
      const moonY = Math.floor(h * 0.48);
      const moonR = Math.max(8, Math.floor(h * 0.13));

      // Earth Globe
      ctx.fillStyle = '#1462b8';
      ctx.beginPath(); ctx.arc(earthX, earthY, earthR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3dff8b';
      ctx.fillRect(earthX - 5, earthY - 4, 7, 5);
      ctx.fillRect(earthX + 2, earthY + 2, 5, 4);

      // Moon Globe
      drawDitheredPlanet(moonX, moonY, moonR, false);

      // Green Outbound Trans-Lunar Trajectory Arc
      ctx.strokeStyle = '#3dff8b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(earthX + earthR, earthY - 4);
      ctx.bezierCurveTo(w * 0.42, h * 0.14, w * 0.62, h * 0.22, moonX - moonR, moonY + 3);
      ctx.stroke();

      // Red Lunar Gateway NRHO Loop
      ctx.strokeStyle = '#ff3b4e';
      ctx.beginPath();
      ctx.ellipse(moonX + 3, moonY + 4, moonR * 1.1, moonR * 2.2, 0.2, 0, Math.PI * 2);
      ctx.stroke();

      // Blue Trans-Earth Return Arc
      ctx.strokeStyle = '#38f2ff';
      ctx.beginPath();
      ctx.moveTo(moonX - 4, moonY - moonR);
      ctx.bezierCurveTo(w * 0.58, h * 0.86, w * 0.38, h * 0.78, earthX + earthR - 2, earthY + 5);
      ctx.stroke();

      // Numbered Mission Waypoint Nodes (1 - 8)
      const nodes = [
        { x: earthX + earthR + 4, y: earthY - 6, c: '#3dff8b' },
        { x: w * 0.36, y: h * 0.28, c: '#3dff8b' },
        { x: w * 0.50, y: h * 0.26, c: '#3dff8b' },
        { x: moonX - moonR - 2, y: moonY + 2, c: '#ffb000' },
        { x: moonX + moonR + 5, y: moonY + 12, c: '#ff3b4e' },
        { x: w * 0.58, y: h * 0.74, c: '#38f2ff' },
        { x: w * 0.40, y: h * 0.72, c: '#38f2ff' },
        { x: earthX + earthR + 2, y: earthY + 6, c: '#38f2ff' }
      ];

      nodes.forEach((n, idx) => {
        ctx.fillStyle = n.c;
        ctx.beginPath(); ctx.arc(n.x, n.y, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#040810';
        ctx.font = '6px monospace';
        ctx.fillText(String(idx + 1), n.x - 1.8, n.y + 2);
      });

      // Live Spacecraft Marker advancing along the journey by Level/Logs
      const activeIdx = Math.min(nodes.length - 1, Math.floor((gameState.level - 1 + totalLogsCount() * 0.1) % nodes.length));
      const ship = nodes[activeIdx];
      const pulse = 4 + Math.sin(t * 0.008) * 1.5;
      ctx.strokeStyle = '#ffb000';
      ctx.beginPath(); ctx.arc(ship.x, ship.y, pulse, 0, Math.PI * 2); ctx.stroke();
    }

    function drawViewport(t) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = '#03060d';
      ctx.fillRect(0, 0, w, h);

      stars.forEach(s => {
        const alpha = 0.45 + 0.55 * Math.abs(Math.sin(t * 0.0018 + s.blink));
        ctx.fillStyle = `rgba(220, 244, 255, ${alpha})`;
        const sx = Math.floor(s.x);
        const sy = Math.floor(s.y);
        ctx.fillRect(sx, sy, 1, 1);
        if (s.cross) {
          ctx.fillRect(sx - 1, sy, 3, 1);
          ctx.fillRect(sx, sy - 1, 1, 3);
        }
      });

      if (viewportMode === 'orbit') {
        // Curved blue Earth horizon spanning across left & center-left windows
        ctx.fillStyle = '#0e4d92';
        ctx.beginPath();
        ctx.arc(w * 0.24, h * 1.65, h * 1.18, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#38f2ff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(w * 0.24, h * 1.65, h * 1.18, Math.PI * 1.05, Math.PI * 1.9);
        ctx.stroke();

        // Planets across center-right & far-right angled windows
        drawDitheredPlanet(Math.floor(w * 0.66), Math.floor(h * 0.34), Math.floor(h * 0.16), true);
        drawDitheredPlanet(Math.floor(w * 0.36), Math.floor(h * 0.32), Math.floor(h * 0.11), false);
        drawDitheredPlanet(Math.floor(w * 0.89), Math.floor(h * 0.58), Math.floor(h * 0.10), false);

        comets.forEach(c => {
          c.x += c.vx * (gameState.activeHazard ? 2.4 : 1);
          c.y += c.vy * (gameState.activeHazard ? 2.4 : 1);
          if (c.x > w + 20) c.x = -20;
          if (c.x < -20) c.x = w + 20;
          if (c.y > h) c.y = 8;

          const cx = Math.floor(c.x);
          const cy = Math.floor(c.y);
          ctx.fillStyle = gameState.activeHazard ? '#ff3b4e' : '#ffb000';
          ctx.fillRect(cx, cy, 3, 2);
          ctx.fillStyle = 'rgba(56, 242, 255, 0.55)';
          ctx.fillRect(cx - Math.sign(c.vx) * 6, cy - 1, 5, 1);
        });
      } else if (viewportMode === 'traj') {
        drawTrajectoryMap(w, h, t);
      } else {
        const cx = Math.floor(w / 2);
        const cy = Math.floor(h / 2);
        const maxR = Math.min(w, h) * 0.4;
        ctx.strokeStyle = 'rgba(56, 242, 255, 0.35)';
        ctx.lineWidth = 1;
        [0.35, 0.7, 1].forEach(m => {
          ctx.beginPath();
          ctx.arc(cx, cy, maxR * m, 0, Math.PI * 2);
          ctx.stroke();
        });
        radarAngle += 0.03;
        ctx.strokeStyle = '#38f2ff';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(radarAngle) * maxR, cy + Math.sin(radarAngle) * maxR);
        ctx.stroke();
        ctx.fillStyle = gameState.activeHazard ? '#ff3b4e' : '#ffb000';
        ctx.fillRect(cx + 22, cy - 12, 3, 3);
        ctx.fillRect(cx - 28, cy + 10, 3, 3);
      }

      drawCockpitFrame(w, h);
      requestAnimationFrame(drawViewport);
    }

    /* =========================================================
       11. BOOT & TIMERS
    ========================================================= */
    function updateTopHUD() {
      document.getElementById('hud-lvl').textContent = gameState.level;
      document.getElementById('hud-credits').textContent = gameState.credits;
      const needed = xpRequiredForLevel(gameState.level);
      const pct = Math.min(100, Math.round((gameState.xp / needed) * 100));
      document.getElementById('hud-xp-bar').style.width = pct + '%';
    }

    setInterval(() => {
      document.getElementById('hud-clock').textContent = new Date().toLocaleTimeString([], { hour12: false });
      applyVitalsDecay();
      renderVitalsMatrix();
    }, 1000);

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    applyVitalsDecay();
    updateTopHUD();
    renderVitalsMatrix();
    renderMainCRT();
    requestAnimationFrame(drawViewport);
  </script>
</body>
